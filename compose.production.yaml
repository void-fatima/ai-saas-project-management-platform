name: platform-production

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-platform}
      POSTGRES_USER: ${POSTGRES_USER:-platform_migrator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set the database administrator password}
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?Set the application database password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/init-database.sh:/docker-entrypoint-initdb.d/10-platform.sh:ro
      - ./scripts/database:/operations:ro
    networks: [database]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12
    logging: *logging

  migrate:
    image: platform-migrate:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: ${MIGRATION_DATABASE_URL:?Set the migration database URL}
    depends_on:
      postgres: { condition: service_healthy }
    networks: [database]
    restart: 'no'
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging: *logging

  api:
    image: platform-api:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    environment:
      NODE_ENV: production
      API_PORT: 3000
      DATABASE_URL: ${DATABASE_URL:?Set the restricted application database URL}
      WEB_ORIGIN: ${WEB_ORIGIN:?Set the public HTTPS origin}
      TRUST_PROXY_HOPS: 1
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      SHUTDOWN_TIMEOUT_MS: 10000
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
      SESSION_ROTATION_HOURS: ${SESSION_ROTATION_HOURS:-24}
      SESSION_ABSOLUTE_HOURS: ${SESSION_ABSOLUTE_HOURS:-720}
      MAIL_MODE: ${MAIL_MODE:-disabled}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      AI_PROVIDER: ${AI_PROVIDER:-disabled}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-15000}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-2048}
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
    networks: [database, application, outbound]
    restart: unless-stopped
    stop_grace_period: 15s
    init: true
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging: *logging

  web:
    image: platform-web:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      api: { condition: service_healthy }
    ports: ['127.0.0.1:${WEB_PORT:-8080}:8080']
    networks: [application]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging: *logging

volumes:
  postgres_data:

networks:
  database: { internal: true }
  application: { internal: true }
  outbound:
