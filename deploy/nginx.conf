worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    # API logs contain safe route templates. Never log raw URLs, query strings or headers here.
    access_log off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 64k;
    client_body_timeout 15s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 30s;
    server {
        listen 8080;
        root /usr/share/nginx/html;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        add_header Cache-Control "no-store" always;
        location = /healthz { return 200 'ok'; }
        location /api/ {
            # Docker DNS refresh avoids stale API addresses after a replacement.
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $api http://api:3000;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            # The loopback-only published port accepts traffic from the host TLS edge.
            # That edge MUST overwrite X-Real-IP with the actual remote address.
            proxy_set_header X-Forwarded-For $http_x_real_ip;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Real-IP "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_buffering off;
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header Cache-Control;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header Strict-Transport-Security;
        }
        location /assets/ { try_files $uri =404; }
        location / { try_files $uri $uri/ /index.html; }
    }
}
